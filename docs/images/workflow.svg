<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .node { fill: #2f81f7; rx: 10; }
      .node-dark { fill: #1b2433; }
      .text { fill: #fff; font-size: 14px; text-anchor: middle; font-weight: 600; }
      .sub { fill: #5a6b7b; font-size: 12px; text-anchor: middle; }
      .out { fill: #3fb950; }
    </style>
  </defs>

  <!-- 顶部:入口节点 -->
  <rect x="280" y="20" width="200" height="46" class="node" rx="10"/>
  <text x="380" y="47" class="text">模糊的医疗需求</text>

  <!-- 追问引擎节点 -->
  <rect x="280" y="120" width="200" height="46" class="node" rx="10"/>
  <text x="380" y="147" class="text">追问引擎</text>

  <!-- 追问过程 4 个小节点 -->
  <rect x="30" y="120" width="200" height="40" class="node-dark" rx="8"/>
  <text x="130" y="145" class="text">① 复述理解,确认对齐</text>

  <rect x="30" y="185" width="200" height="40" class="node-dark" rx="8"/>
  <text x="130" y="210" class="text">② 按框架维度推进</text>

  <rect x="30" y="250" width="200" height="40" class="node-dark" rx="8"/>
  <text x="130" y="275" class="text">③ 点破隐含矛盾</text>

  <rect x="30" y="315" width="200" height="40" class="node-dark" rx="8"/>
  <text x="130" y="340" class="text">④ 补全领域现实</text>

  <!-- 判定 -->
  <rect x="280" y="240" width="200" height="46" class="node" rx="10"/>
  <text x="380" y="267" class="text">能画出完整数据流?</text>

  <!-- 输出 -->
  <rect x="280" y="380" width="200" height="46" class="node" rx="10"/>
  <text x="380" y="407" class="text">输出方案 + 代码</text>

  <!-- 输出细节 -->
  <rect x="540" y="380" width="190" height="40" class="node-dark" rx="8"/>
  <text x="635" y="405" class="text">数据流图 / 已定决策</text>

  <rect x="540" y="445" width="190" height="40" class="node-dark" rx="8"/>
  <text x="635" y="470" class="text">可运行代码</text>

  <!-- 箭头连线(带动画:stroke-dashoffset 流动) -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8b98a5"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f81f7"/>
    </marker>
  </defs>

  <style>
    .line { stroke: #8b98a5; stroke-width: 2; fill: none; }
    .line-flow { stroke-dasharray: 6 6; animation: dash 1.2s linear infinite; }
    .line-blue { stroke: #2f81f7; stroke-width: 2; fill: none; }
    @keyframes dash { to { stroke-dashoffset: -12; } }
  </style>

  <!-- 入口 → 追问引擎 -->
  <line x1="380" y1="66" x2="380" y2="118" class="line line-flow" marker-end="url(#arrow)"/>
  <!-- 追问引擎 → 判定 -->
  <line x1="380" y1="166" x2="380" y2="238" class="line line-flow" marker-end="url(#arrow)"/>
  <!-- 追问引擎 → ① -->
  <line x1="280" y1="143" x2="232" y2="143" class="line" marker-end="url(#arrow)"/>
  <!-- ①→②→③→④ -->
  <line x1="130" y1="160" x2="130" y2="183" class="line line-flow" marker-end="url(#arrow)"/>
  <line x1="130" y1="225" x2="130" y2="248" class="line line-flow" marker-end="url(#arrow)"/>
  <line x1="130" y1="290" x2="130" y2="313" class="line line-flow" marker-end="url(#arrow)"/>
  <!-- ④ → 判定(回环) -->
  <line x1="230" y1="335" x2="280" y2="262" class="line line-flow" marker-end="url(#arrow)"/>
  <!-- 判定 → 输出 -->
  <line x1="380" y1="286" x2="380" y2="378" class="line line-flow" marker-end="url(#arrow)"/>
  <!-- 输出 → 细节 -->
  <line x1="480" y1="402" x2="538" y2="402" class="line" marker-end="url(#arrow)"/>
  <line x1="480" y1="425" x2="538" y2="465" class="line" marker-end="url(#arrow)"/>

  <!-- 判定 的"否"回环线(顶部回绕) -->
  <path d="M280,263 L60,263 L60,143 L118,143" class="line line-blue" marker-end="url(#arrowBlue)"/>
  <text x="170" y="255" class="sub">否,继续追问</text>

  <text x="50" y="120" class="sub" font-size="13">追问过程(循环)</text>
</svg>
