<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .node { fill: #2f81f7; }
      .node-dark { fill: #161b22; }
      .node-line { fill: none; stroke: #2f81f7; stroke-width: 2; }
      .text { fill: #ffffff; font-size: 15px; text-anchor: middle; font-weight: 600; }
      .text-dark { fill: #e6edf3; font-size: 14px; text-anchor: middle; font-weight: 500; }
      .sub { fill: #8b98a5; font-size: 12px; text-anchor: middle; }
      .line { stroke: #8b98a5; stroke-width: 2; fill: none; }
      .line-flow { stroke: #2f81f7; stroke-width: 2.5; fill: none; stroke-dasharray: 7 7; animation: dash 1.1s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -14; } }
    </style>
  </defs>

  <!-- 顶部:入口 -->
  <rect x="360" y="30" width="200" height="48" rx="24" class="node"/>
  <text x="460" y="59" class="text">模糊的医疗需求</text>

  <!-- 追问引擎(核心,居中) -->
  <rect x="350" y="140" width="220" height="52" rx="10" class="node-dark" stroke="#2f81f7" stroke-width="2"/>
  <text x="460" y="172" class="text">追问引擎</text>

  <!-- 4 个追问步骤(横排,铺满宽度) -->
  <rect x="40" y="260" width="190" height="46" rx="8" class="node-dark"/>
  <text x="135" y="287" class="text-dark">① 复述理解</text>

  <rect x="270" y="260" width="190" height="46" rx="8" class="node-dark"/>
  <text x="365" y="287" class="text-dark">② 按框架推进</text>

  <rect x="500" y="260" width="190" height="46" rx="8" class="node-dark"/>
  <text x="595" y="287" class="text-dark">③ 点破矛盾</text>

  <rect x="730" y="260" width="190" height="46" rx="8" class="node-dark"/>
  <text x="825" y="287" class="text-dark">④ 注入领域现实</text>

  <!-- 判定 -->
  <rect x="340" y="370" width="240" height="48" rx="10" class="node-line"/>
  <text x="460" y="399" class="text">能画出完整数据流?</text>

  <!-- 输出 -->
  <rect x="350" y="470" width="220" height="48" rx="24" class="node"/>
  <text x="460" y="499" class="text">输出方案 + 代码</text>

  <!-- 连线:入口→追问引擎 -->
  <path d="M460,78 L460,138" class="line-flow" marker-end="url(#arrowBlue)"/>
  <!-- 追问引擎 → 4 步骤(向两侧发散) -->
  <path d="M400,192 L135,258" class="line" marker-end="url(#arrowGrey)"/>
  <path d="M460,192 L365,258" class="line" marker-end="url(#arrowGrey)"/>
  <path d="M460,192 L595,258" class="line" marker-end="url(#arrowGrey)"/>
  <path d="M520,192 L825,258" class="line" marker-end="url(#arrowGrey)"/>
  <!-- 4 步骤 → 判定(向下汇聚) -->
  <path d="M135,306 L460,368" class="line" marker-end="url(#arrowGrey)"/>
  <path d="M365,306 L430,368" class="line" marker-end="url(#arrowGrey)"/>
  <path d="M595,306 L490,368" class="line" marker-end="url(#arrowGrey)"/>
  <path d="M825,306 L460,368" class="line" marker-end="url(#arrowGrey)"/>
  <!-- 判定 → 输出 -->
  <path d="M460,418 L460,468" class="line-flow" marker-end="url(#arrowBlue)"/>
  <!-- 判定"否"回环(左侧) -->
  <path d="M340,394 L30,394 L30,166 L344,166" class="line-flow" marker-end="url(#arrowBlue)"/>
  <text x="185" y="384" class="sub">否,继续追问</text>

  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f81f7"/>
    </marker>
    <marker id="arrowGrey" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8b98a5"/>
    </marker>
  </defs>
</svg>
